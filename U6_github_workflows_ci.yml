# U6 — GitHub Actions CI skeleton for sparse_regvelo validation
# STATUS: template only; no digest; no external-rerun claim.
# AUTHORIZATION: generated as skeleton; must be reviewed, enabled, and run by human.
# PLACEMENT: .github/workflows/ci.yml in the repository root.

name: sparse_regvelo-validation-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q sparse_regvelo/tests/

